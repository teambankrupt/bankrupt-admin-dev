<label class="visually-hidden" for="categorySelect">PostCategory</label>
<util-progress *ngIf="loading" [bar]="true"></util-progress>
<ng-select
  id="categorySelect"
  #categorySelect
  [items]="items"
  [hideSelected]="true"
  [multiple]="false"
  [addTag]="enableAdd"
  (keyup)="searchForEvent($event)"
  bindLabel="name"
  [(ngModel)]="selectedItem"
  (change)="onSelected($event)"
  [ngModelOptions]="{standalone: true}"
  placeholder="Search Category">
</ng-select>
