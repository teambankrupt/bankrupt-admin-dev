<util-progress *ngIf="loading" [bar]="true"></util-progress>
<div class="row" [@loaded]="!loading">
  <div class="col-xl-12">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title mb-4">Create/Update Blog</h4>
        <form [formGroup]="blogForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="title-input" class="form-label">
                <span i18n="@@label.Title">Title</span><em class="error">*</em>
              </label>
              <input type="text" class="form-control" id="title-input" placeholder="Enter Title"
                     name="title" formControlName="title">
              <em class="text-danger">
                {{ errMsg(blogForm, 'title', 'minLength', 'Title should be at least 3 characters!') }}
              </em>
            </div>

            <div class="mb-3 col-md-6">
              <label for="organization" class="form-label">
                <span i18n="@@label.Organization">Organization</span><em class="error">*</em>
              </label>
              <app-organization-select
                id="organization"
                [selectedItem]="selectedOrg"
                (selected)="onOrgSelected($event)"
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="subtitle-input" class="form-label">
              <span i18n="@@label.Subtitle">Subtitle</span><em class="error">*</em>
            </label>
            <input type="text" class="form-control" id="subtitle-input" placeholder="Enter Subtitle"
                   name="subtitle" formControlName="subtitle">
            <em class="text-danger">
              {{ errMsg(blogForm, 'subtitle', 'minLength', 'Subtitle should be at least 3 characters!') }}
            </em>
          </div>

          <div class="row">
            <app-file-picker
              class="col-lg-6"
              title="{{translations['Logo']}}"
              [multiSelect]="false"
              [existingImages]="getExLogo()"
              [required]="false"
              (onUploaded)="onLogoUploaded($event)"
            ></app-file-picker>

            <app-file-picker
              class="col-lg-6"
              title="{{translations['BannerImage']}}"
              [multiSelect]="false"
              [existingImages]="getExBanner()"
              [required]="false"
              (onUploaded)="onBannerUploaded($event)"
            ></app-file-picker>
          </div>

          <div class="d-flex flex-wrap gap-3 float-end">
            <button class="btn btn-secondary waves-effect" (click)="onCancel()">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary waves-effect waves-light"
                    [ngClass]="blogForm.valid?'':'disabled'" (click)="onSubmit()">
              Submit
            </button>
          </div>
        </form>
      </div>
      <!-- end card body -->
    </div>
    <!-- end card -->
  </div>
</div>
