<util-progress *ngIf="loading" [bar]="true"></util-progress>
<div class="row" [@loaded]="!loading">
  <div class="col-xl-12">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title mb-4">Create/Update PostCategory</h4>
        <form [formGroup]="postCategoryForm">
          <div class="mb-3">
            <label for="name-input" class="form-label">
              <span i18n="@@label.Name">Name</span><em class="error">*</em>
            </label>
            <input type="text" class="form-control" id="name-input" placeholder="Enter Name"
                   name="name" formControlName="name">
            <em class="text-danger">
              {{ errMsg(postCategoryForm, 'name', 'minLength', 'Name should be at least 3 characters!') }}
            </em>
          </div>

          <div class="mb-3">
            <label for="description" class="form-label">
              <span i18n="@@label.Description">Description</span>
            </label>
            <textarea class="form-control" id="description" placeholder="Enter Description" rows="5"
                      name="description" formControlName="description"></textarea>
            <em class="text-danger">
              {{ errMsg(postCategoryForm, 'description', 'minLength', 'Description should be at least 20 characters!') }}
            </em>
          </div>

          <app-file-picker
            title="{{translations['Image']}}"
            [multiSelect]="false"
            [existingImages]="getExImages()"
            [required]="false"
            (onUploaded)="onImgUploaded($event)"
          ></app-file-picker>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="parent" class="form-label">
                <span i18n="@@label.SelectCategory">Select Category</span>
              </label>
              <app-postcategory-select
                id="parent"
                [selectedItem]="selectedParent"
                (selected)="onPostCategorySelected($event)"
              />
            </div>

            <div class="col-md-6">
              <label for="blog" class="form-label col-md-6">
                <span i18n="@@label.SelectBlog">Select Blog</span><em class="error">*</em>
              </label>
              <app-blog-select
                id="blog"
                [selectedItem]="selectedBlog"
                (selected)="onBlogSelected($event)"
              />
            </div>
          </div>

          <div class="d-flex flex-wrap gap-3 float-end">
            <button class="btn btn-secondary waves-effect" (click)="onCancel()">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary waves-effect waves-light"
                    [ngClass]="postCategoryForm.valid?'':'disabled'" (click)="onSubmit()">
              Submit
            </button>
          </div>
        </form>
      </div>
      <!-- end card body -->
    </div>
    <!-- end card -->
  </div>
</div>
