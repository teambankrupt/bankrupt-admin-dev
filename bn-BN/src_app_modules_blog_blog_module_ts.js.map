<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body">
        <div class="pt-3">
          <div class="row justify-content-center">
            <div class="col-xl-8">
              <div>
                <div class="text-center">
                  <div class="mb-4">
                    <a *ngFor="let h of blogPost?.content?.hashtags" href="javascript: void(0);"
                       [routerLink]="['/blog/', blogSlug,'hashtags', h,'posts']"
                       class="badge bg-light font-size-12 me-2">
                      <i class="bx bx-hash align-middle text-muted me-1"></i> {{ h }}
                    </a>
                  </div>
                  <h4>{{ blogPost?.title }}</h4>
                  <p class="text-muted mb-4"><i
                    class="mdi mdi-calendar me-1"></i> {{ blogPost?.created_at | readableDate }}</p>
                </div>

                <hr>
                <div class="text-center">
                  <div class="row">
                    <div class="col-sm-4">
                      <div>
                        <p class="text-muted mb-2">Categories</p>
                        <h5 class="font-size-15">{{ getCategoryNames(blogPost) }}</h5>
                      </div>
                    </div>
                    <div class="col-sm-4">
                      <div class="mt-4 mt-sm-0">
                        <p class="text-muted mb-2">Published At</p>
                        <h5 class="font-size-15">{{ blogPost?.published_at | readableDate }}</h5>
                      </div>
                    </div>
                    <div class="col-sm-4">
                      <div class="mt-4 mt-sm-0">
                        <p class="text-muted mb-2">Post by</p>
                        <h5 class="font-size-15">{{ blogPost?.created_by }}</h5>
                      </div>
                    </div>
                  </div>
                </div>
                <hr>

                <div class="my-5" *ngIf="blogPost?.featured_image">
                  <img src="{{blogPost?.featured_image}}" alt="" class="img-thumbnail mx-auto d-block">
                </div>

                <hr>

                <div class="mt-4">
                  <div class="text-muted font-size-16">
                    <p
                      [innerHTML]="blogPost?.content?.content??'' | hashtagV2: '/#/blog/'+ blogSlug + '/hashtags/:hashtag:/posts'"></p>
                  </div>

                  <hr>
